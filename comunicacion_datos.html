/* delfOS · Teletipo — components/bundle.css — v0.3.1 — 13/11/2026
   Componentes en CSS puro: cada uno es marcado HTML + estas clases. Los valores salen de tokens.css.
   La celda de la grilla es 1ch × 20px de JetBrains Mono a 13px. */

/* ── Base ─────────────────────────────────────────────────────────────── */
.tt { font-family: var(--font-mono); font-size: 13px; line-height: 20px; color: var(--tinta);
  font-variant-numeric: tabular-nums; font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0;
  -webkit-font-smoothing: antialiased; }
.tt-mesa { background-color: var(--mesa);
  background-image: radial-gradient(circle at 50% 50%, var(--mesa-trama) 0 0.9px, transparent 1.2px);
  background-size: 2ch 20px; }
.tt-hoja { background: var(--hoja); color: var(--tinta); }
.tt-lectura { font-family: var(--font-serif); font-size: 16px; line-height: 26px; font-variant-numeric: lining-nums proportional-nums; }
.tt-pregunta { margin: 0; font: 400 24px/30px var(--font-serif); color: var(--tinta); }
.tt-tenue { color: var(--tinta-2); }
.tt-tenue-3 { color: var(--tinta-3); }
.tt-inverso { background: var(--tinta); color: var(--hoja); }
.tt-resaltado { background: linear-gradient(transparent 2px, var(--resaltador) 2px, var(--resaltador) calc(100% - 1px), transparent calc(100% - 1px));
  color: var(--sobre-resaltador); border-radius: var(--radio-1); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.tt :focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; }

/* ── Ventana: hoja con marco de caracteres ────────────────────────────── */
.tt-ventana { position: relative; display: flex; flex-direction: column; min-width: 0;
  background: var(--hoja); color: var(--tinta); box-shadow: var(--sombra-hoja); padding: 24px 2ch 14px; }
.tt-ventana::before { content: ""; position: absolute; inset: 10px .5ch 6px; border: 1px solid var(--tinta-3); pointer-events: none; }
.tt-ventana.is-foco::before { inset: 9px calc(.5ch - 1px) 5px; border: 3px double var(--tinta); }
.tt-ventana.is-flotante { box-shadow: var(--sombra-flotante); }
.tt-ventana__barra { position: absolute; top: 0; left: 1.5ch; right: 1.5ch; height: 20px; z-index: 1;
  display: flex; align-items: center; justify-content: space-between; gap: 1ch; }
.tt-ventana__titulo { margin: 0; padding: 0 1ch; min-width: 0; background: var(--hoja);
  font: 400 13px/20px var(--font-mono); color: var(--tinta-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt-ventana.is-foco .tt-ventana__titulo { color: var(--tinta); font-weight: 700; }
.tt-ventana__titulo::before { content: "[ "; font-weight: 400; color: var(--tinta-3); }
.tt-ventana__titulo::after { content: " ]"; font-weight: 400; color: var(--tinta-3); }
.tt-ventana__controles { flex: none; display: flex; align-items: center; padding: 0 .5ch; background: var(--hoja); }
.tt-ventana__num { padding: 0 .5ch; color: var(--tinta-3); }
.tt-ventana__controles button { appearance: none; margin: 0; border: 0; padding: 0 .25ch; background: none;
  font: inherit; color: var(--tinta-2); cursor: pointer; }
.tt-ventana__controles button:hover { color: var(--tinta); }
.tt-ventana__cuerpo { flex: 1 1 auto; min-height: 0; overflow: auto; }
.tt-ventana__fuente { margin: 8px 0 0; font: 400 11px/16px var(--font-mono); color: var(--tinta-3); }
/* papel continuo: perforaciones de arrastre en los dos márgenes */
.tt-ventana.is-continuo { padding-left: calc(2ch + 22px); padding-right: calc(2ch + 22px);
  background-image: radial-gradient(circle at 11px 10px, var(--mesa) 0 4px, transparent 4.6px),
                    radial-gradient(circle at calc(100% - 11px) 10px, var(--mesa) 0 4px, transparent 4.6px);
  background-size: 100% 20px; }
.tt-ventana.is-continuo::before { left: 24px; right: 24px; }
.tt-ventana.is-continuo .tt-ventana__barra { left: calc(24px + 1ch); right: calc(24px + 1ch); }

/* ── Menú y barra de estado ───────────────────────────────────────────── */
.tt-menu { display: flex; align-items: stretch; height: 20px; background: var(--hoja); border-bottom: 1px solid var(--tinta); white-space: nowrap; overflow: hidden; }
.tt-menu__marca { display: flex; align-items: center; padding: 0 1ch; background: var(--tinta); color: var(--hoja); font-weight: 700; }
.tt-menu button { appearance: none; margin: 0; border: 0; padding: 0 1ch; background: none; font: inherit; color: var(--tinta); cursor: pointer; }
.tt-menu button u { text-decoration-thickness: 1px; text-underline-offset: 3px; }
.tt-menu button:hover, .tt-menu button[aria-expanded="true"] { background: var(--tinta); color: var(--hoja); }
.tt-menu__lado { margin-left: auto; display: flex; align-items: center; padding: 0 1ch; color: var(--tinta-2); }
.tt-estado { display: flex; flex-wrap: wrap; align-items: center; min-height: 20px; background: var(--tinta); color: var(--hoja); }
.tt-estado > * { padding: 0 1ch; white-space: nowrap; box-shadow: inset -1px 0 0 var(--tinta-3); }
.tt-estado > :last-child { margin-left: auto; box-shadow: none; }

/* ── Pestañas ─────────────────────────────────────────────────────────── */
.tt-pestanas { display: flex; flex-wrap: wrap; margin: 0 0 8px; border-bottom: 1px solid var(--tinta); }
.tt-pestana { appearance: none; margin: 0; border: 0; padding: 0 1ch; height: 20px; display: inline-flex; align-items: center; gap: 1ch;
  background: none; font: inherit; color: var(--tinta-2); cursor: pointer; }
.tt-pestana + .tt-pestana { box-shadow: inset 1px 0 0 var(--regla); }
.tt-pestana[aria-selected="true"] { background: var(--tinta); color: var(--hoja); box-shadow: none; }

/* ── Botón ────────────────────────────────────────────────────────────── */
.tt-boton { appearance: none; height: 22px; padding: 0 1ch; font: inherit; color: var(--tinta); background: var(--hoja);
  border: 1px solid var(--tinta); box-shadow: 2px 2px 0 0 var(--tinta); cursor: pointer; }
.tt-boton:active { transform: translate(2px, 2px); box-shadow: none; }
.tt-boton--tinta { background: var(--tinta); color: var(--hoja); box-shadow: 2px 2px 0 0 var(--tinta-3); }
.tt-boton[disabled] { color: var(--tinta-3); border-color: var(--tinta-3); box-shadow: none; cursor: not-allowed; }

/* ── Paleta de comandos ───────────────────────────────────────────────── */
.tt-paleta { width: 60ch; max-width: 100%; }
.tt-paleta__entrada { display: flex; gap: 1ch; align-items: center; border-bottom: 1px solid var(--tinta); }
.tt-paleta__entrada label { color: var(--tinta-3); }
.tt-paleta__entrada input { flex: 1; min-width: 0; height: 20px; padding: 0; border: 0; background: transparent; font: inherit; color: var(--tinta); }
.tt-paleta__lista { list-style: none; margin: 4px 0 0; padding: 0; }
.tt-paleta__lista li { display: grid; grid-template-columns: 4ch minmax(0, 1fr) auto; column-gap: 1ch; padding: 0 1ch; }
.tt-paleta__lista li > :nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tt-paleta__lista li[aria-selected="true"] { background: var(--tinta); color: var(--hoja); }

/* ── Gráficos de glifos ───────────────────────────────────────────────── */
.tt-glifos { white-space: pre; letter-spacing: 0; font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }
/* barras de postura: apoya █, rechaza ▒, escala común desde cero */
.tt-postura { list-style: none; margin: 0; padding: 0; }
.tt-postura li { display: grid; grid-template-columns: 3ch minmax(12ch, 1fr) 40ch 7ch; column-gap: 1ch; align-items: baseline; }
.tt-postura__titulo { font: 400 14px/20px var(--font-serif); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tt-postura__barra { white-space: pre; letter-spacing: 0; }
.tt-postura__cifra { text-align: right; color: var(--tinta-2); }
.tt-postura li.is-sel > * { background: var(--resaltador); color: var(--sobre-resaltador); }
.tt-leyenda { color: var(--tinta-2); white-space: pre-wrap; }
/* sábana: narrativas × tiempo, rampa calibrada " .:=*#%@" */
.tt-sabana { margin: 0; font: 400 13px/17px var(--font-mono); overflow-x: auto; }
.tt-sabana__fila { display: grid; grid-template-columns: 4ch max-content 7ch; column-gap: 1ch; white-space: pre; }
.tt-sabana__tira { letter-spacing: 0; box-shadow: inset 1px 0 0 var(--regla), inset -1px 0 0 var(--regla); }
.tt-sabana__total { text-align: right; color: var(--tinta-2); }
.tt-sabana__eje { color: var(--tinta-3); }
.tt-sabana__fila.is-ruido { color: var(--tinta-3); }
.tt-sabana__fila.is-sel .tt-sabana__id, .tt-sabana__fila.is-sel .tt-sabana__tira { background: var(--resaltador); color: var(--sobre-resaltador); }
.tt-sabana__origen { font-weight: 800; outline: 1px solid var(--tinta); outline-offset: -1px; }
/* chispa: serie compacta ▁▂▃▄▅▆▇█ */
.tt-chispa { font: 400 16px/16px var(--font-mono); white-space: pre; letter-spacing: 0; }
/* pajar: todas las cuentas, una celda cada diez; ◆ donde hay coordinación */
.tt-pajar { margin: 0; font: 400 13px/15px var(--font-mono); white-space: pre; letter-spacing: 0; color: var(--tinta-3); }
.tt-pajar b { font-weight: 400; color: var(--violeta); }

/* ── Marcas de autoría ────────────────────────────────────────────────── */
.tt-sello { display: inline-flex; align-items: center; gap: 1ch; padding: 1px 1ch; border: 3px double currentColor;
  border-radius: var(--radio-2); font: 700 13px/18px var(--font-mono); color: var(--violeta); background: var(--violeta-velo); transform: rotate(-1.5deg); }
.tt-sello--verde { color: var(--verde); background: var(--verde-velo); }
.tt-sello--rojo { color: var(--rojo); background: var(--rojo-velo); }
.tt-sello--plano { transform: none; }
.tt-coord { color: var(--violeta); }
.tt-arbitro { color: var(--verde); }
.tt-nota { font: italic 400 15px/22px var(--font-serif); color: var(--rojo); }
.tt-nota::before { content: "¶ "; font: normal 700 13px/1 var(--font-mono); }

/* ── Tabla de papel continuo: bandas de tres renglones ────────────────── */
.tt-tabla { width: 100%; border-collapse: collapse; font: 400 13px/20px var(--font-mono); }
.tt-tabla caption { text-align: left; padding-bottom: 4px; color: var(--tinta-2); }
.tt-tabla th { text-align: left; font-weight: 700; padding: 0 1ch; border-bottom: 1px solid var(--tinta); white-space: nowrap; }
.tt-tabla td { padding: 0 1ch; vertical-align: top; }
.tt-tabla tbody tr:nth-child(6n+1) td, .tt-tabla tbody tr:nth-child(6n+2) td, .tt-tabla tbody tr:nth-child(6n+3) td { background: var(--banda); }
.tt-tabla .num { text-align: right; white-space: nowrap; }
.tt-tabla .lectura { font: 400 14px/20px var(--font-serif); }
.tt-tabla tr[aria-selected="true"] td { background: var(--resaltador); color: var(--sobre-resaltador); }

/* ── Terminal: el registro de la corrida ──────────────────────────────── */
.tt-terminal { margin: 0; font: 400 13px/20px var(--font-mono); white-space: pre-wrap; color: var(--tinta); }
.tt-terminal__prompt { color: var(--tinta-3); }
.tt-terminal__aviso { font-weight: 700; }
.tt-terminal__aviso::before { content: "[!] "; }
.tt-terminal__cursor { display: inline-block; width: 1ch; background: var(--tinta); color: var(--hoja); animation: tt-parpadeo 1s steps(1) infinite; }
@keyframes tt-parpadeo { 50% { background: transparent; } }
/* la impresión: cada línea entra en su turno (--i), una vez, al abrir */
.tt-imprime > * { animation: tt-linea 1ms steps(1) both; animation-delay: calc(var(--i, 0) * 60ms); }
@keyframes tt-linea { from { visibility: hidden; } to { visibility: visible; } }

/* ── Recibo: el costo como ticket ─────────────────────────────────────── */
.tt-recibo { width: 44ch; max-width: 100%; padding: 26px 2ch; background: var(--hoja); color: var(--tinta); font: 400 13px/20px var(--font-mono);
  -webkit-mask: radial-gradient(circle 6px at 50% 0, #0000 96%, #000) 50% 0 / 14px 51% repeat-x, radial-gradient(circle 6px at 50% 100%, #0000 96%, #000) 50% 100% / 14px 51% repeat-x;
  mask: radial-gradient(circle 6px at 50% 0, #0000 96%, #000) 50% 0 / 14px 51% repeat-x, radial-gradient(circle 6px at 50% 100%, #0000 96%, #000) 50% 100% / 14px 51% repeat-x; }
.tt-recibo__centro { text-align: center; }
.tt-recibo__corte { margin: 4px 0; height: 0; border-top: 1px dashed var(--tinta-3); }
.tt-recibo__fila { display: grid; grid-template-columns: auto 1fr auto; column-gap: 1ch; align-items: baseline; }
.tt-recibo__fila::before { content: ""; grid-column: 2; grid-row: 1; align-self: end; margin-bottom: 5px; border-bottom: 1px dotted var(--tinta-3); }
.tt-recibo__fila > :first-child { grid-column: 1; grid-row: 1; }
.tt-recibo__fila > :last-child { grid-column: 3; grid-row: 1; text-align: right; }
.tt-recibo__total { font-size: 24px; line-height: 28px; font-weight: 700; }
.tt-recibo__barras { white-space: pre; letter-spacing: 0; }

/* ── Modo oscuro: los componentes no cambian; cambian los valores de tokens.css ([data-theme="oscuro"]) ── */
[data-theme="oscuro"] { color-scheme: dark; }

/* ── Movimiento, puntero grueso e impresión ───────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  .tt-terminal__cursor { animation: none; }
  .tt-imprime > * { animation: none; }
  .tt-boton:active { transform: none; }
}
@media (pointer: coarse) {
  .tt-boton, .tt-pestana, .tt-menu button, .tt-ventana__controles button { min-height: 44px; min-width: 44px; }
}
@media print {
  .tt-mesa { background: none; }
  .tt-ventana { box-shadow: none; break-inside: avoid; }
  .tt-menu, .tt-estado, .tt-ventana__controles { display: none; }
  .tt-terminal__cursor { display: none; }
}

/* delfOS · Teletipo — piezas de las vistas (escritorio, árbol, filas que se eligen). Va después de tokens.css y bundle.css. */
/* ── Piezas de las vistas ──────────────────────────────────── */
.tt-lectura, .tt-pregunta, .tt-cita, .tt-postura__titulo, .tt-nota, .tt-tabla .lectura, .tt-titulo { font-variant-ligatures: normal; font-feature-settings: normal; }
.tt-titulo { margin: 0; font: 600 21px/28px var(--font-serif); color: var(--tinta); }
.tt-fila { appearance: none; display: block; width: 100%; margin: 0; padding: 0; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.tt-fila:hover { background: var(--banda); }
.tt-postura--botones li { display: block; }
.tt-postura__fila { display: grid; grid-template-columns: 3ch minmax(12ch, 1fr) 40ch 7ch; column-gap: 1ch; align-items: baseline; }
.tt-postura li.is-sel .tt-postura__fila > * { background: var(--resaltador); color: var(--sobre-resaltador); }
.tt-sabana .tt-fila { display: grid; }
.tt-sabana .tt-fila:hover .tt-sabana__tira { background: var(--banda); }
.tt-sabana__fila.is-sel:hover .tt-sabana__tira { background: var(--resaltador); }
.tt-desborde { overflow-x: auto; max-width: 100%; }
.tt-escritorio { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px; padding: 24px 2ch 28px; }
.tt-escritorio__lateral { flex: 1 1 34ch; min-width: 0; }
.tt-escritorio__centro { flex: 999 1 560px; min-width: 0; display: grid; gap: 32px 24px; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); align-items: start; }
.tt-ancho { grid-column: 1 / -1; }
.tt-dos { display: grid; gap: 32px 24px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
.tt-tres { display: grid; gap: 32px 24px; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
@media (max-width: 1180px) { .tt-escritorio__centro, .tt-dos, .tt-tres { grid-template-columns: minmax(0, 1fr); } }
.tt-arbol { margin: 0; padding: 0; list-style: none; }
.tt-arbol li { white-space: pre; }
.tt-arbol .tt-fila { display: flex; gap: 1ch; }
.tt-arbol__grupo { margin: 12px 0 2px; font-weight: 700; }
.tt-arbol__grupo:first-child { margin-top: 0; }
.tt-arbol .is-abierta { background: var(--tinta); color: var(--hoja); }
.tt-arbol li.is-sel .tt-fila { background: var(--resaltador); color: var(--sobre-resaltador); }
.tt-arbol li.is-sel .tt-fila > * { color: var(--sobre-resaltador); }
.tt-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(17ch, 1fr)); gap: 8px 2ch; margin: 0; }
.tt-campos dt { color: var(--tinta-2); }
.tt-campos dd { margin: 0; font: 500 24px/28px var(--font-mono); }
.tt-hueco { color: var(--tinta-3); }
.tt-aviso { margin: 0; padding: 8px 1.5ch; box-shadow: inset 0 0 0 1px var(--violeta); background: var(--violeta-velo); color: var(--violeta); font: 400 15px/22px var(--font-serif); font-variant-ligatures: normal; font-feature-settings: normal; }
.tt-banner { margin: 0; font: 700 16px/18px var(--font-mono); white-space: pre; letter-spacing: 0; color: var(--tinta); }
.tt-banner b { font-weight: 400; color: var(--tinta-3); }
.tt-cita { margin: 0; font: 400 16px/26px var(--font-serif); }
.tt-cita::before { content: "«"; } .tt-cita::after { content: "»"; }
.tt-lista { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.tt-etapas { margin: 0; padding: 0; list-style: none; }
.tt-etapas li { display: grid; grid-template-columns: 9ch minmax(0, 1fr) 17ch 6ch; column-gap: 1ch; align-items: baseline; }
.tt-etapas__nombre { font-weight: 700; }
.tt-etapas__que { font: 400 15px/22px var(--font-serif); color: var(--tinta-2); font-variant-ligatures: normal; font-feature-settings: normal; }
.tt-etapas__barra { white-space: pre; letter-spacing: 0; }
.tt-etapas__s { text-align: right; color: var(--tinta-2); }
.tt-etapas__union { color: var(--tinta-3); white-space: pre; }
.tt-modelo { color: var(--tinta); font-weight: 700; }
.tt-enlace { color: var(--tinta); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.tt-enlace:hover { background: var(--resaltador); color: var(--sobre-resaltador); }
@media (max-width: 700px) { .tt-etapas li { grid-template-columns: 9ch minmax(0, 1fr); } .tt-etapas__barra, .tt-etapas__s { grid-column: 2; } }

/* delfOS · el tablero. Lo propio de esta página, encima del sistema de diseño (tablero/sistema): usa solo sus valores. */
* { box-sizing: border-box; }
html { scroll-padding-top: 64px; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button { font: inherit; color: inherit; }
summary { cursor: pointer; }
[hidden] { display: none !important; }

/* La marca: el logotipo compuesto en tipo, con las dos últimas letras en video inverso. */
.marca { font-weight: 700; white-space: nowrap; }
.marca__os { display: inline-block; margin-left: .25ch; padding: 0 .4ch; background: var(--tinta); color: var(--hoja); }

/* Nivel 1: la barra del sistema. En el archivo suelto la pone el tablero; dentro de la aplicación, la aplicación. */
.d-barra { position: sticky; top: 0; z-index: 8; flex: none; }
.d-barra__marca { display: flex; align-items: center; padding: 0 1ch; }
.d-estado { position: sticky; bottom: 0; z-index: 8; flex: none; }
.en-app .d-barra, .en-app .d-estado { display: none; }

/* Nivel 2: las pestañas del tablero, más discretas. */
.d-nivel2 { position: sticky; top: 21px; z-index: 7; flex: none; display: flex; align-items: flex-end; gap: 2ch;
  padding: 8px 2ch 0; background: var(--mesa); }
.en-app .d-nivel2 { top: 0; }
.d-nivel2 .tt-pestanas { flex: 1; margin: 0; }
.d-interruptor { appearance: none; height: 21px; margin: 0; border: 0; border-bottom: 1px solid var(--tinta); padding: 0 1ch;
  background: none; color: var(--tinta-2); white-space: nowrap; cursor: pointer; }
.d-interruptor:hover { color: var(--tinta); }

.d-marco { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 38ch; gap: 0 3ch; align-items: start;
  padding: 20px 2ch 40px; }
.sin-nota .d-marco { grid-template-columns: minmax(0, 1fr); }
.sin-nota .d-nota { display: none; }
#vista { min-width: 0; container-type: inline-size; }
#vista > section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px 3ch; align-items: start; }
#vista > section.d-mesa { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); }
#vista > section.d-corrida { grid-template-columns: 46ch minmax(0, 1fr); }
.d-ancho { grid-column: 1 / -1; }
.d-columna { display: grid; gap: 28px; min-width: 0; }
@container (max-width: 780px) {
  #vista > section.d-mesa, #vista > section.d-corrida { grid-template-columns: minmax(0, 1fr); }
}

/* Texto. */
.d-respuesta { margin: 6px 0 12px; max-width: 76ch; }
.d-mono { font: 400 13px/20px var(--font-mono); font-variant-ligatures: none; }
.d-rotulo { margin: 16px 0 4px; font: 700 13px/20px var(--font-mono); }
.d-rotulo:first-child { margin-top: 0; }
.d-ayuda { margin: 0 0 8px; color: var(--tinta-2); max-width: 96ch; }
.d-vacio { color: var(--tinta-3); }
.d-id { color: var(--tinta-2); }
.d-etiqueta { display: inline-block; margin-left: 1ch; padding: 0 .6ch; border: 1px solid var(--tinta-3); color: var(--tinta-2);
  font: 400 11px/16px var(--font-mono); vertical-align: 2px; white-space: nowrap; }
.d-enlace { appearance: none; margin: 8px 0 0; border: 0; padding: 0; background: none; cursor: pointer; }
.d-leyenda { display: flex; flex-wrap: wrap; gap: 0 3ch; margin-top: 6px; color: var(--tinta-2); }
.d-muestra { display: inline-block; width: 2ch; height: 10px; margin-right: 1ch; vertical-align: -1px; color: var(--tinta); }
.tt-sello { margin: 2px 0 10px; }
.tt-aviso { margin-top: 12px; }

/* Lo que se puede tocar para ver su nota, y la ventana de notas. */
[data-nota] { cursor: help; }
button[data-nota] { cursor: pointer; }
[data-nota]:hover { outline: 1px dashed var(--tinta-3); outline-offset: 2px; }
[data-nota].elegido { outline: 1px solid var(--tinta); outline-offset: 2px; }
span[data-nota] { text-decoration: underline dotted var(--tinta-3); text-decoration-thickness: 1px; text-underline-offset: 4px; }
.d-nota { position: sticky; top: 64px; max-height: calc(100vh - 116px); }
.en-app .d-nota { top: 44px; max-height: calc(100vh - 64px); }
.d-nota .tt-titulo { margin: 2px 0 10px; font-size: 18px; line-height: 24px; }
.d-nota__bloque { padding: 8px 1ch 10px; border-left: 3px solid var(--tinta); }
.d-nota__bloque h4 { margin-bottom: 2px; font: 700 13px/20px var(--font-mono); }
.d-nota__bloque p { font: 400 14px/22px var(--font-serif); font-variant-ligatures: normal; font-feature-settings: normal; }
.d-nota__como { margin-top: 10px; border-left-color: var(--tinta-3); background: var(--banda); }

/* Narrativas: una fila por narrativa, con su barra partida en apoya (tinta llena) y rechaza (gris con borde). */
.d-postura__fila { display: grid; grid-template-columns: 4ch minmax(10ch, 1.3fr) minmax(8ch, 1fr) 7ch; column-gap: 1ch;
  align-items: center; min-height: 20px; }
.d-postura.is-completa .d-postura__fila { grid-template-columns: 4ch minmax(10ch, 1.5fr) minmax(8ch, 1fr) 7ch var(--reparto, 31ch); min-height: 24px; }
.d-reparto { color: var(--tinta-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-barra2 { display: flex; height: 12px; }
.d-barra2 i, .d-muestra { display: inline-block; }
.d-barra2 i { height: 100%; }
.d-apoya { background: currentColor; }
.d-rechaza { background: color-mix(in srgb, currentColor 26%, transparent); box-shadow: inset 0 0 0 1px currentColor; }
.d-sinpostura { outline: 1px dashed currentColor; outline-offset: -1px; }
.d-coordinado { background: var(--violeta); }
li.is-sel > .tt-fila, li.is-sel > .tt-fila:hover { background: var(--resaltador); color: var(--sobre-resaltador); }
li.is-sel .tt-postura__cifra, li.is-sel .d-id, li.is-sel .d-reparto, li.is-sel .d-nace { color: inherit; }
.d-fija { cursor: help; }
.d-seleccion { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--regla); min-height: 76px; }
.d-seleccion .tt-titulo { margin-top: 2px; font-size: 18px; line-height: 24px; }

/* El tiempo: una fila por narrativa, con barras de altura. */
.d-tiempo__fila { display: grid; grid-template-columns: 4ch minmax(0, 26ch) minmax(100px, 1fr) 7ch 17ch; column-gap: 1ch;
  align-items: center; }
.d-tiempo__eje { pointer-events: none; }
.d-graf { display: block; width: 100%; height: 30px; }
.d-tiempo.is-alta .d-graf { height: 44px; }
.d-tiempo.is-alta .d-tiempo__fila { grid-template-columns: 4ch minmax(0, 44ch) minmax(100px, 1fr) 7ch 17ch; }
.d-graf.is-alto { height: 120px; }
.d-graf .b { fill: currentColor; }
.d-graf .b2 { fill: currentColor; fill-opacity: .3; }
.d-graf .b3 { fill: currentColor; fill-opacity: .12; }
.d-graf .coord { fill: var(--violeta); }
.d-graf .dia { stroke: var(--regla); stroke-width: 1; vector-effect: non-scaling-stroke; }
.d-graf .origen { stroke: currentColor; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.d-graf .origen-marca { fill: currentColor; }
.d-graf .zona { fill: transparent; }
.d-graf .zona:hover { fill: color-mix(in srgb, var(--tinta) 14%, transparent); }
.d-eje { position: relative; height: 18px; color: var(--tinta-3); font-size: 11px; line-height: 16px; }
.d-eje span { position: absolute; top: 0; padding-left: .5ch; border-left: 1px solid var(--regla); white-space: nowrap; }
.d-nace { color: var(--tinta-2); white-space: nowrap; }
.d-nace.is-tarde { color: var(--tinta); font-weight: 700; }
.d-todos { color: var(--tinta-3); }
@container (max-width: 700px) {
  .d-tiempo__fila { grid-template-columns: 4ch minmax(80px, 1fr) 7ch; }
  .d-tiempo__fila > .tt-postura__titulo, .d-tiempo__fila > .d-nace { display: none; }
  .d-postura.is-completa .d-postura__fila { grid-template-columns: 4ch minmax(10ch, 1.3fr) minmax(8ch, 1fr) 7ch; }
  .d-postura.is-completa .d-reparto { display: none; }
}

/* La operación contra las demás cuentas, y el pajar. */
.d-pares { display: grid; gap: 10px; margin: 6px 0 10px; }
.d-par__que { color: var(--tinta-2); }
.d-par__fila { display: grid; grid-template-columns: 13ch minmax(3ch, 1fr) 12ch; column-gap: 1ch; align-items: center; }
.d-par__barra { height: 10px; box-shadow: inset 0 -1px 0 var(--regla); }
.d-par__barra i { display: block; height: 100%; min-width: 2px; background: currentColor; }
.d-par__valor { text-align: right; white-space: nowrap; }
.d-pajar { margin: 10px 0 4px; white-space: normal; word-break: break-all; font-size: 9px; line-height: 8px; letter-spacing: 1.5px; }
.d-pajar b { font-weight: 700; }

/* La ficha de una narrativa. */
.tt-campos { margin: 10px 0 4px; }
.tt-campos dd small { display: block; font: 400 11px/16px var(--font-mono); color: var(--tinta-2); }
.d-frases { display: flex; flex-wrap: wrap; gap: 4px 1ch; }
.d-frases span { padding: 0 1ch; border: 1px solid var(--regla); font: 400 14px/20px var(--font-serif); }
.d-dos { display: grid; grid-template-columns: repeat(auto-fit, minmax(30ch, 1fr)); gap: 12px 3ch; }
.d-lado h4 { margin-bottom: 4px; font: 700 13px/20px var(--font-mono); }
.d-cita { margin-bottom: 8px; }
.d-cita .tt-cita { font-size: 15px; line-height: 22px; overflow-wrap: anywhere; }
.d-cita small { display: block; font: 400 11px/16px var(--font-mono); color: var(--tinta-2); }
.d-barras { display: grid; grid-template-columns: minmax(12ch, 34ch) minmax(6ch, 1fr) 20ch; gap: 2px 1ch; align-items: center; }
.d-barras .tt-postura__titulo { white-space: normal; }
.d-barras .barra { height: 10px; box-shadow: inset 0 -1px 0 var(--regla); }
.d-barras .barra i { display: block; height: 100%; min-width: 2px; background: currentColor; }
.d-barras .cuanto { text-align: right; color: var(--tinta-2); white-space: nowrap; }
.d-repite li { display: grid; grid-template-columns: 19ch minmax(0, 1fr); column-gap: 1ch; padding: 2px 0; border-top: 1px solid var(--regla); }
.d-repite li > span:first-child { color: var(--tinta-2); }

/* Tablas, filtros y avisos. */
.tt-tabla th button { appearance: none; margin: 0; border: 0; padding: 0; background: none; font: inherit; color: inherit; cursor: pointer; }
.tt-tabla th[aria-sort="descending"] button::after { content: " ↓"; }
.tt-tabla th[aria-sort="ascending"] button::after { content: " ↑"; }
.tt-tabla td.largo { min-width: 26ch; overflow-wrap: anywhere; }
.tt-tabla td.lectura { white-space: normal; }
.tt-tabla tr.is-marcada td:first-child { box-shadow: inset 3px 0 0 var(--violeta); }
.tt-tabla td.is-marca { font-weight: 700; }
.tt-tabla tr.is-base td { font-weight: 700; border-bottom: 1px solid var(--tinta); }
.tt-tabla th small { display: block; font-weight: 400; color: var(--tinta-2); }

<script id="textos" type="application/json">{"inicio": {"titulo": "Cómo leer el tablero", "que": "Tocá cualquier cifra, fila, gráfico o tabla. Acá aparece qué muestra ese elemento.", "como": "Y acá, cómo lo obtiene el análisis: de qué datos sale y con qué regla."}, "cifra_comentarios": {"titulo": "Comentarios", "que": "Cuántos comentarios tiene el set que se analizó: {comentarios}. Van del {desde} al {hasta}, en {publicaciones} de {fuentes}.", "como": "Se cuentan las filas del archivo de comentarios. Si un identificador se repite, queda la primera fila. Ningún comentario se descarta por tener datos sucios: una fecha que no se puede leer o una respuesta a un comentario que no existe se anotan, y el comentario sigue en el análisis."}, "cifra_narrativas": {"titulo": "Narrativas detectadas", "que": "Cuántas narrativas distintas se detectaron: {narrativas}. Una narrativa es una afirmación que se repite con distintas palabras, junto con quienes la discuten. {con_narrativa} comentarios ({pct_con_narrativa} del total) pertenecen a alguna.", "como": "No se parte de una lista de temas. Primero se juntan los textos casi iguales. Después se mira quién le responde a quién: los grupos de textos que se responden mucho entre sí forman una narrativa. La cantidad de narrativas sale sola de los datos."}, "cifra_ruido": {"titulo": "Ruido", "que": "Qué parte de los comentarios no pertenece a ninguna narrativa: {ruido} comentarios, el {pct_ruido} del total. Son reacciones, saludos, temas sueltos o comentarios que no se pudieron ubicar.", "como": "Es lo que queda afuera después de armar las narrativas: comentarios cuyo texto no participa de ninguna discusión con respuestas y que tampoco responden a un comentario con narrativa. Con clave de IA, un paso más revisa los grupos grandes de ese resto, por si esconden una narrativa que nadie respondió."}, "cifra_coordinadas": {"titulo": "Cuentas con señales de coordinación", "que": "Cuántas cuentas muestran señales de coordinación: {cuentas_coordinadas} de {cuentas} ({pct_coordinadas}), en {operaciones}. Una operación es un grupo de cuentas que actúan juntas. Es conducta observada en este set: no identifica bots ni autoría y no prueba intención.", "como": "Se buscan cuentas que repiten juntas un mismo comportamiento: pegar los mismos textos, o comentar las mismas publicaciones con minutos de diferencia, una y otra vez y mucho más de lo esperable por azar. Una coincidencia sola no alcanza. Cada señal se prueba además contra el mismo set con las cuentas mezcladas al azar: si ahí aparece igual, no distingue nada y se apaga."}, "narrativa": {"titulo": "Una narrativa", "que": "La narrativa «{titulo}» tiene {comentarios} comentarios: el {pct} de los que tienen narrativa. La apoyan {apoya} ({pct_apoya}) y la rechazan {rechaza} ({pct_rechaza}). El largo de la barra es la cantidad de comentarios; los colores, las dos posturas.", "como": "Un comentario pertenece a la narrativa si su texto es de los grupos que la forman, o si responde a un comentario de la narrativa. La postura sale de las respuestas: una respuesta con contenido queda del lado contrario al comentario que responde, y una respuesta corta que solo acompaña («tal cual») queda del mismo lado. El lado que apoya es el que tiene más comentarios que no responden a nadie; si los dos lados están parejos y hay clave de IA, lo decide la IA leyendo ejemplos de cada uno."}, "postura": {"titulo": "Apoyan y rechazan", "que": "De los {comentarios} comentarios de la narrativa, {apoya} la apoyan ({pct_apoya}) y {rechaza} la rechazan ({pct_rechaza}). {decide}", "como": "Una respuesta con contenido queda del lado contrario al comentario que responde; una respuesta corta que solo acompaña queda del mismo lado. Así cada narrativa se parte en dos lados. El lado que apoya es el que tiene más comentarios que no responden a nadie. Si los dos lados están parejos y hay clave de IA, la IA lee ejemplos de cada lado, dos veces y en distinto orden, y decide solo si las dos respuestas coinciden."}, "titulo": {"titulo": "Título y frases clave", "que": "El título resume la afirmación de la narrativa. Las frases clave son las formas más repetidas de decirla entre quienes la apoyan. {de_ia}", "como": "Con clave de IA, el modelo redacta el título a partir de esas frases, y se acepta solo si no agrega palabras que no estén en los comentarios. Si no hay clave, o si el título no pasa ese control, queda la frase más repetida tal como la deja la limpieza del texto: en minúsculas y sin tildes. Esos títulos van entre comillas y con la etiqueta «frase más repetida»."}, "origen": {"titulo": "Origen", "que": "Cuándo apareció la narrativa: {origen}, en la hora del set ({zona}).", "como": "El origen de una narrativa es su primer comentario propio al que le siguen al menos otros 2 en menos de 3 horas. Un comentario suelto y aislado, horas antes, no cuenta. Es una estimación del análisis, no un dato del set."}, "cuentas_narrativa": {"titulo": "Cuentas distintas", "que": "{cuentas} cuentas distintas escribieron al menos un comentario de esta narrativa.", "como": "Se cuentan las cuentas distintas entre los comentarios de la narrativa."}, "coordinados_narrativa": {"titulo": "De cuentas con señales de coordinación", "que": "Qué parte de esta narrativa escribieron cuentas con señales de coordinación: {coordinados} de sus {comentarios} comentarios ({pct}).", "como": "Se cruzan los comentarios de la narrativa con las cuentas que quedaron en alguna operación."}, "crecimiento": {"titulo": "Cómo creció", "que": "Cuántos comentarios tuvo «{titulo}» en cada tramo de {tramo}. La marca ▼ señala su origen estimado: {origen}. El tramo con más comentarios tuvo {pico}.", "como": "Cada comentario se cuenta en el tramo de su fecha, en la hora del set ({zona}). Los comentarios sin una fecha legible no aparecen. En la lista, cada fila usa su propia escala: sirve para ver la forma (cuándo creció y si se apaga), no para comparar tamaños entre filas."}, "tiempo_total": {"titulo": "Todos los comentarios en el tiempo", "que": "Todos los comentarios del set por tramo de {tramo}: los que tienen narrativa y el ruido. El tramo con más comentarios tuvo {pico}.", "como": "Cada comentario se cuenta en el tramo de su fecha, en la hora del set ({zona}). Los comentarios sin una fecha legible no aparecen."}, "ejemplos": {"titulo": "Qué dice cada lado", "que": "Los comentarios con más «me gusta» de cada lado, sin repetir textos. Sirven para leer con qué palabras se dice la narrativa y con cuáles se la discute.", "como": "Se ordenan los comentarios de cada lado por cantidad de «me gusta» y se muestran los primeros textos distintos. No los eligió una persona ni la IA."}, "fuentes_narrativa": {"titulo": "En qué fuentes circula", "que": "En qué fuentes están las publicaciones donde aparece esta narrativa, y qué parte de sus comentarios hay en cada una.", "como": "Cada comentario se cuenta en la fuente de la publicación donde se escribió. Se dice que la narrativa se concentra en una fuente cuando pesa ahí al menos {umbral} veces lo que la fuente pesa en el total."}, "tabla_narrativas": {"titulo": "Todas las narrativas, en tabla", "que": "Todas las narrativas con todas sus cifras. Tocando el nombre de una columna, la tabla se ordena por ella.", "como": "Cada fila reúne lo que el análisis dejó para esa narrativa: cuántos comentarios tiene, cuántos la apoyan y la rechazan, cuántas cuentas distintas escribieron, cuándo apareció y cuántos de sus comentarios son de cuentas coordinadas."}, "operacion": {"titulo": "Una operación", "que": "La operación {etiqueta} reúne {cuentas} con señales de coordinación. Escribieron {comentarios}: {por_cuenta} por cuenta, contra {por_cuenta_demas} de las demás cuentas del set.", "como": "Una operación une a las cuentas que comparten una misma señal de coordinación: los mismos textos repetidos, o las mismas publicaciones comentadas con minutos de diferencia. Si dos grupos tienen cuentas en común, forman una sola operación."}, "empuja": {"titulo": "Qué empuja", "que": "En qué narrativas escriben las cuentas de la operación y con qué postura. El porcentaje dice qué parte de esa narrativa viene de la operación.", "como": "Se cuentan los comentarios de las cuentas de la operación, por narrativa y por postura."}, "repite": {"titulo": "Lo que más repite", "que": "Los textos que más repiten las cuentas de la operación: cuántas veces aparece cada uno y entre cuántas cuentas.", "como": "Se cuentan los textos idénticos entre los comentarios de la operación."}, "cuando_actua": {"titulo": "Cuándo actúa", "que": "Cuándo escriben las cuentas de la operación, por tramo de {tramo}. El tramo con más actividad tuvo {pico}.", "como": "Cada comentario de la operación se cuenta en el tramo de su fecha, en la hora del set ({zona})."}, "cuentas_operacion": {"titulo": "Las cuentas, una por una", "que": "Las cuentas de la operación, una por una, con sus datos y su actividad en el set. Tocando el nombre de una columna, la tabla se ordena por ella.", "como": "El usuario, la fecha de creación, los seguidores y los seguidos vienen del archivo de cuentas del set. Los comentarios se cuentan en el archivo de comentarios."}, "senales": {"titulo": "Las cuatro señales de coordinación", "que": "Cuántas cuentas marcó cada una de las cuatro señales en esta corrida, y cuántas marcó con las cuentas mezcladas al azar. Una cuenta puede estar marcada por más de una señal.", "como": "Texto propio: pocas cuentas que repiten mucho un mismo texto o hashtag. Sincronía por narrativa y sincronía por publicación: pares de cuentas que comentan lo mismo con menos de 15 minutos de diferencia, en 4 publicaciones o más, muy por encima del azar. Respuestas en grupo: cuentas que se responden entre sí. Si una señal marca con las cuentas mezcladas la mitad o más de lo que marca con el set real, no distingue nada: se apaga y queda avisado."}, "parte_coordinada": {"titulo": "Parte de cada narrativa que viene de cuentas con señales", "que": "Qué parte de los comentarios de cada narrativa escribieron cuentas con señales de coordinación. La barra más larga equivale a {max}: la escala está ampliada para que se vea.", "como": "Se cruzan los comentarios de cada narrativa con las cuentas que quedaron en alguna operación."}, "fuentes": {"titulo": "Narrativas por fuente", "que": "Cómo se reparten los comentarios de cada narrativa entre las fuentes. Cada fila suma 100 %. La primera fila es la referencia: el reparto de todos los comentarios del set. La marca ▲ señala dónde una narrativa se concentra.", "como": "Cada comentario se cuenta en la fuente de la publicación donde se escribió. Una celda lleva ▲ cuando la narrativa pesa en esa fuente al menos {umbral} veces lo que la fuente pesa en el total y tiene {minimo} comentarios o más ahí."}, "avisos": {"titulo": "Avisos del análisis", "que": "Lo que el motor avisó sobre este set, dicho en llano. Un aviso no frena el análisis: señala algo a tener en cuenta al leer el resultado. El texto original del motor queda plegado debajo.", "como": "Antes de analizar, el motor mide el set (cuántas respuestas tiene, cuántos textos distintos, cuánto concentra la publicación más grande) y lo compara con un set de referencia. También avisa cuando apaga una señal de coordinación: prueba cada señal con las cuentas mezcladas al azar y, si ahí marca la mitad o más de lo que marca con las reales, no distingue nada."}, "limites": {"titulo": "Cómo leer las cifras", "que": "Lo que hay que tener presente al leer las cifras de este tablero.", "como": "El tablero muestra lo que detectó el análisis. No lo compara con una respuesta correcta, porque el set no la trae."}, "costo": {"titulo": "El recibo de la corrida", "que": "Cuánto se procesó, cuánto tardó cada etapa, cuánto costó la IA y en qué equipo corrió. La cifra grande es el costo de IA por cada mil comentarios.", "como": "El motor mide el tiempo de reloj de cada etapa y suma los tokens de todos los pedidos al modelo de IA, al precio de la API. Queda en el archivo costo.json del resultado y en el informe de la corrida. La suma de las etapas puede no dar el total: algunas corren a la vez."}, "uso_ia": {"titulo": "Uso de la IA", "que": "Cómo se usó la IA en la corrida: cuántos pedidos distintos hubo, cuántos fueron a la API, cuántos salieron de la caché y cuántos fallaron.", "como": "La IA entra en tres momentos: decidir qué lado apoya cuando los dos están parejos, redactar los títulos y revisar el ruido. Un pedido repetido sale de la caché y no se paga dos veces. Si un pedido falla, esa parte usa su respaldo y el análisis sigue."}, "set_entrada": {"titulo": "El set de entrada", "que": "Las medidas del set de entrada, cada una al lado de su valor en el set de referencia.", "como": "Se miden antes de analizar. Cuando una medida queda por debajo de la mitad o por encima del doble de la referencia, el motor avisa: el set es de otro tipo y conviene leer el resultado con más cuidado."}, "parametros": {"titulo": "Parámetros del motor", "que": "Los valores con que corrió el motor. Son fijos: no se ajustan a cada set.", "como": "Se eligieron con pruebas sobre varios sets, mirando el promedio y el peor caso, y quedaron congelados."}, "archivos": {"titulo": "Los archivos del resultado", "que": "Los archivos que deja el análisis. El tablero se arma leyéndolos: no agrega ni cambia ningún dato.", "como": "Los escribe el motor al terminar. Tienen el formato que pide el desafío."}, "comentarios": {"titulo": "Comentarios", "que": "Los comentarios del set, uno por uno, con la narrativa y la postura que les asignó el análisis. Se pueden filtrar por narrativa, por postura, por texto y por cuentas con señales de coordinación.", "como": "Es el archivo de comentarios del resultado, unido al texto, la cuenta y la fuente de cada comentario en el set."}, "origen_todas": {"titulo": "Cuándo nace cada narrativa", "que": "Qué narrativas ya circulaban el primer día del set y cuáles aparecen después. Una narrativa que nace a mitad del período es una narrativa emergente.", "como": "El origen de una narrativa es su primer comentario propio al que le siguen al menos otros 2 en menos de 3 horas. Un comentario suelto y aislado, horas antes, no cuenta. Es una estimación del análisis, no un dato del set."}, "tabla_origen": {"titulo": "Nacimiento y pico", "que": "Para cada narrativa: cuándo nace, cuándo aparece su primer comentario y cuál fue su tramo con más comentarios. Tocando el nombre de una columna, la tabla se ordena por ella.", "como": "«Nace» es el origen estimado: el primer comentario propio al que le siguen otros 2 en menos de 3 horas. «Primer comentario» es el más antiguo de la narrativa, aunque esté aislado. El pico es el tramo de {tramo} con más comentarios."}, "tabla_dias": {"titulo": "Comentarios por día", "que": "Cuántos comentarios tuvo cada narrativa en cada día del set, con el ruido en la última fila. Son los números de la figura de arriba.", "como": "Cada comentario se cuenta en el día de su fecha, en la hora del set ({zona})."}, "par_antiguedad": {"titulo": "Antigüedad de las cuentas", "que": "Qué tan nuevas son las cuentas de la operación: al empezar el set, la mitad tenía {dias} o menos. En las demás cuentas, ese valor es de {dias_demas}.", "como": "A la fecha del primer comentario del set se le resta la fecha de creación de cada cuenta, y se toma el valor del medio (la mediana). La antigüedad no se usa para detectar la coordinación: se muestra como contexto."}, "par_por_cuenta": {"titulo": "Comentarios por cuenta", "que": "Cuánto escribe cada cuenta, en promedio: {por_cuenta} comentarios las de la operación y {por_cuenta_demas} las demás.", "como": "Los comentarios de cada grupo, divididos por su cantidad de cuentas. No se usa para detectar la coordinación: se muestra como contexto."}, "par_concentracion": {"titulo": "Concentración en una narrativa", "que": "Qué parte de sus comentarios dedica cada grupo a «{titulo}» ({narrativa}), la narrativa donde más escribe la operación: {de_la_op} la operación y {de_las_demas} las demás cuentas.", "como": "Para la operación: sus comentarios en esa narrativa sobre todos sus comentarios. Para las demás cuentas, lo mismo. Cuando la operación le dedica mucho más que el resto, la está empujando."}, "par_apoyo": {"titulo": "Apoyo a esa narrativa", "que": "De los comentarios que cada grupo escribe en «{titulo}» ({narrativa}), cuántos la apoyan: {de_la_op} en la operación y {de_las_demas} en las demás cuentas.", "como": "Los comentarios que apoyan sobre el total de comentarios de cada grupo en esa narrativa. La postura sale de la estructura de las respuestas, igual que para todas las cuentas."}, "pajar": {"titulo": "Todas las cuentas", "que": "Todas las cuentas del set en {celdas} celdas de {por_celda} cuentas cada una. La marca ◆ señala las {con_marca} celdas donde hay al menos una cuenta con señales de coordinación. Sirve para ver qué pocas son.", "como": "Las cuentas se ordenan por su identificador y se agrupan de a {por_celda}. La posición de cada marca no significa nada: el orden de los identificadores no es un orden en el tiempo ni por parecido."}}</script>
<script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("datos").textContent);
  const NOTAS = JSON.parse(document.getElementById("textos").textContent);
  const T = D.totales, TR = D.tramos, INF = D.informe, G = D.genuinas, SVG = "http://www.w3.org/2000/svg";
  // Abierto desde la aplicación, el tablero suma el explorador de comentarios, que necesita al servidor.
  const Q = new URLSearchParams(location.search), APP = Q.get("app") === "1", raiz = document.documentElement;
  const UMBRAL = 1.5, MINIMO = 30;  // una narrativa «se concentra» en una fuente si pesa ahí 1,5 veces lo que la fuente pesa en el total
  const porEtiqueta = {};
  D.narrativas.forEach((n) => { porEtiqueta[n.etiqueta] = n; });
  const porVolumen = D.narrativas.slice().sort((a, b) => b.comentarios - a.comentarios || a.etiqueta.localeCompare(b.etiqueta));
  const porOrigen = D.narrativas.filter((n) => n.comentarios).sort((a, b) =>
    (a.origen_s == null ? Infinity : a.origen_s) - (b.origen_s == null ? Infinity : b.origen_s) || (a.primero_s || 0) - (b.primero_s || 0));
  const diaInicial = D.periodo.desde_s == null ? null : Math.floor(D.periodo.desde_s / 86400);
  const fuentesConDatos = D.fuentes.filter((f) => f.comentarios);

  // --- Elementos, números y fechas -----------------------------------------------------------------------
  function el(tag, attrs) {
    const e = document.createElement(tag);
    Object.keys(attrs || {}).forEach((k) => {
      if (k === "texto") e.textContent = attrs[k];
      else if (k === "clase") e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    for (let i = 2; i < arguments.length; i++) if (arguments[i] != null) e.append(arguments[i]);
    return e;
  }
  function svg(tag, attrs) {
    const e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach((k) => e.setAttribute(k, attrs[k]));
    return e;
  }
  const id = (x) => document.getElementById(x);
  const num = (n) => Number(n).toLocaleString("es-AR");
  const dec = (n, d) => Number(n).toLocaleString("es-AR", { minimumFractionDigits: d, maximumFractionDigits: d });
  function pct(parte, total) {
    if (!total) return "sin datos";
    const v = 100 * parte / total;
    return dec(v, v > 0 && v < 1 ? 2 : 1) + " %";
  }
  // Un porcentaje chico se entiende mejor como «1 de cada N».
  const unoDeCada = (parte, total) => parte > 0 && parte / total < 0.01 ? "1 de cada " + num(Math.round(total / parte)) : "";
  function pctFino(parte, total) {
    const u = unoDeCada(parte, total);
    return pct(parte, total) + (u ? ", " + u : "");
  }
  const dos = (n) => String(n).padStart(2, "0");
  // Las fechas llegan como segundos en la hora local del set: se leen con los métodos UTC para no moverlas.
  function fecha(s, conHora) {
    const d = new Date(s * 1000), f = dos(d.getUTCDate()) + "/" + dos(d.getUTCMonth() + 1);
    return conHora === false ? f : f + " " + dos(d.getUTCHours()) + ":" + dos(d.getUTCMinutes());
  }
  const hora = (s) => fecha(s).slice(6);
  const fechaLarga = (s) => fecha(s, false) + "/" + new Date(s * 1000).getUTCFullYear();
  const plural = (n, uno, muchos) => num(n) + " " + (n === 1 ? uno : muchos);
  function tramoTexto() {
    const s = TR.segundos;
    if (!s) return "tiempo";
    if (s % 86400 === 0) return s === 86400 ? "1 día" : s / 86400 + " días";
    return s === 3600 ? "1 hora" : s / 3600 + " horas";
  }
  const dias = (n) => n == null ? "sin datos" : plural(Math.round(n), "día", "días");
  function boton(texto, clase, alTocar, etiqueta) {
    const b = el("button", { type: "button", clase: clase || "", texto: texto });
    if (etiqueta) { b.setAttribute("aria-label", etiqueta); b.title = etiqueta; }
    b.addEventListener("click", alTocar);
    return b;
  }
  const enlace = (texto, alTocar) => boton(texto, "tt-enlace d-enlace", alTocar);
  const lista = (cosas) => cosas.length < 2 ? cosas.join("") : cosas.slice(0, -1).join(", ") + " y " + cosas[cosas.length - 1];

      filas.push({ nombre: "Idioma del set", este: m.idioma.idioma_del_set + (Object.keys(p).length ? " (" + Object.keys(p).map((x) => x + " " + parte(p[x])).join(", ") + ")" : ""), referencia: "" });
    }
    const sucios = Object.keys(m.integridad || {}).filter((x) => INTEGRIDAD[x] && m.integridad[x]);
    filas.push({ nombre: "Datos sucios", este: sucios.length ? sucios.map((x) => num(m.integridad[x]) + " " + INTEGRIDAD[x]).join("; ") : "ninguno", referencia: "" });
    return nota(ventana("El set de entrada", { num: k }, tabla([{ titulo: "Medida", valor: (f) => f.nombre }, { titulo: "Este set", valor: (f) => f.este, largo: true },
      { titulo: "Set de referencia", valor: (f) => f.referencia }], filas)), "set_entrada");
  }
  function pintarCorrida(s) {
    s.classList.add("d-corrida");
    const c = D.costo, derecha = el("div", { clase: "d-columna" });
    s.append(el("div", { clase: "d-columna" }, c ? recibo() : el("p", { clase: "d-vacio", texto: "El resultado no trae costo.json." })), derecha);
    if (c && c.segundos != null) {
      derecha.append(ventana("La corrida", { num: 1, foco: true, fuente: "costo.json del resultado" + (INF ? " y el informe de la corrida." : ".") }, pregunta("¿Cuánto costó?"),
        respuesta("El análisis procesó " + num(c.comentarios_procesados == null ? T.comentarios : c.comentarios_procesados) + " comentarios en " + dec(c.segundos, 1) + " segundos" +
          (Number(c.usd_ia) ? " y gastó USD " + dec(c.usd_ia, 4) + " en IA: USD " + dec(c.usd_por_mil_comentarios || 0, 6) + " por cada mil comentarios." : ", sin gasto de IA."))));
    }
    derecha.append(ventanaAvisos({ num: 2 }) || "");
    const limites = el("ul", { clase: "d-lista" }), punto = (t) => limites.append(el("li", { texto: t }));
    punto("Estas cifras son lo que detectó el análisis. El tablero no las contrasta con una respuesta correcta: muestra el resultado, no mide cuánto acertó.");
    punto(num(T.ruido) + " comentarios (" + pct(T.ruido, T.comentarios) + ") quedaron sin narrativa. Son reacciones, temas sueltos o comentarios que no se pudieron ubicar en ninguna.");
    punto("Una cuenta figura con señales de coordinación cuando el análisis la agrupó en una operación. Que una cuenta no figure no prueba que sea genuina.");
    punto("El origen de cada narrativa es una estimación del análisis, no un dato del set.");
    if (c && Number(c.tokens_ia) === 0) punto("Esta corrida no usó IA: los títulos son la frase más repetida de cada narrativa, en minúsculas y sin tildes.");
    const sinTitulo = D.narrativas.filter((n) => n.sin_titulo).length;
    if (sinTitulo) punto(plural(sinTitulo, "narrativa no tiene", "narrativas no tienen") + " título en el resultado: se muestra su etiqueta.");
    if (T.sin_hora) punto(plural(T.sin_hora, "comentario no tiene", "comentarios no tienen") + " una fecha legible y no aparecen en los gráficos de tiempo.");
    if (T.sin_entrega) punto(plural(T.sin_entrega, "comentario del set no está", "comentarios del set no están") + " en el resultado: se cuentan como ruido.");
    D.problemas.forEach((p) => punto("Datos sucios del set: " + p.problema + " (" + num(p.cantidad) + ")."));
    if (!INF) punto("Este tablero se armó sin el informe de la corrida: no muestra los avisos del motor, las señales de coordinación ni los tiempos por etapa.");
    derecha.append(nota(ventana("Cómo leer las cifras", { num: 3 }, limites), "limites"));
    let k = 4;
    if (INF) {
      const u = INF.uso_modelo || {};
      derecha.append(nota(ventana("Uso de la IA", { num: k++ }, INF.sin_modelo ? el("p", { clase: "d-vacio", texto: "Esta corrida se hizo sin IA, a propósito." })
        : ficha([["Pedidos distintos", u.pedidos], ["Llamadas a la API en esta corrida", u.llamadas_api], ["Respuestas que salieron de la caché", u.respuestas_de_cache],
          ["Pedidos que fallaron", u.errores], ["Tokens", u.tokens == null ? null : num(u.tokens)], ["Costo de todos los pedidos", u.usd == null ? null : "USD " + dec(u.usd, 4)],
          ["Gastado en esta corrida", u.usd_gastado == null ? null : "USD " + dec(u.usd_gastado, 4)],
          ["Títulos redactados por la IA", D.narrativas.filter((n) => n.titulo_de_ia === true).length + " de " + D.narrativas.length]])), "uso_ia"));
      derecha.append(ventanaSetDeEntrada(k++) || "");
      const parametros = Object.keys(INF.configuracion || {});
      if (parametros.length) {
        derecha.append(nota(ventana("Parámetros del motor", { num: k++ }, el("details", null, el("summary", { texto: "Ver los " + parametros.length + " parámetros" }),
          ficha(parametros.map((x) => [x, typeof INF.configuracion[x] === "object" ? JSON.stringify(INF.configuracion[x]) : String(INF.configuracion[x])])))), "parametros"));
      }
    }
    if (c) derecha.append(nota(ventana("Notas de la corrida", { num: k++ }, ficha([["Equipo", c.hardware], ["Almacenamiento", c.almacenamiento], ["Notas del motor", c.notas]])), "costo"));
    derecha.append(nota(ventana("Los archivos del resultado", { num: k++ }, ficha([
      ["comentarios.csv", "Una fila por comentario: su narrativa y su postura. El ruido va con las dos vacías."],
      ["narrativas.csv", "Una fila por narrativa: el título, las frases clave y la fecha de origen."],
      ["cuentas.csv", "Una fila por cuenta: la operación a la que pertenece, o vacío si no está en ninguna."],
      ["costo.json", "Cuánto se procesó, cuánto tardó, cuánto costó la IA y en qué equipo corrió."]])), "archivos"));
    s.append(pie());
  }

  // --- La barra de estado y el arranque -------------------------------------------------------------------
  function pintarEstado() {
    const c = D.costo || {}, partes = ["listo", plural(T.narrativas, "narrativa", "narrativas"), pct(T.con_narrativa, T.comentarios) + " con narrativa",
      "◆ " + plural(T.cuentas_coordinadas, "cuenta", "cuentas"), c.usd_ia == null ? null : "USD " + dec(c.usd_ia, 4), c.segundos == null ? null : dec(c.segundos, 1) + " s",
      elegida ? "selección " + elegida : "sin selección", "Tocá una cifra o una figura para ver su nota"];
    id("estado").replaceChildren(...partes.filter(Boolean).map((t) => el("span", { texto: t })));
  }
  document.addEventListener("click", (ev) => {
    const fila = ev.target.closest("[data-elige]"), explicable = ev.target.closest("[data-nota]"), v = ev.target.closest("[data-ventana]");
    if (fila) elegir(fila.dataset.elige);
    if (explicable) mostrarNota(explicable);
    if (v) enfocar(v);
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" && ev.target.matches && ev.target.matches("[data-nota]:not(button)")) mostrarNota(ev.target);
  });
  // La aplicación puede pedir una pestaña o una narrativa desde su árbol.
  window.addEventListener("message", (ev) => {
    if (ev.origin !== location.origin || !ev.data) return;
    if (ev.data.delfos === "elegir") elegir(ev.data.id, true);
    if (ev.data.delfos === "pestana") abrir(ev.data.id);
  });
  let temaAntes = null;
  window.addEventListener("beforeprint", () => {
    PESTANAS.forEach(pintarPestana);
    temaAntes = raiz.getAttribute("data-theme");
    ponerTema("papel");
  });
  window.addEventListener("afterprint", () => { if (temaAntes) ponerTema(temaAntes); });

  if (APP) document.body.classList.add("en-app");
  ponerTema(temaGuardado());
  verNotas(!angosto());
  id("set").textContent = D.nombre ? D.nombre + " · " + huella : D.set;
  PESTANAS.forEach((p) => {
    const b = boton(p.nombre, "tt-pestana", () => abrir(p.id));
    b.id = "b-" + p.id;
    b.setAttribute("role", "tab");
    id("pestanas").append(b);
    id("vista").append(el("section", { id: "p-" + p.id, hidden: "" }));
  });
  pintarEstado();
  abrir(location.hash.slice(1));
  if (APP && window.parent !== window) {
    window.parent.postMessage({ delfos: "tablero", narrativas: porVolumen.map((n) => ({ id: n.etiqueta, titulo: n.titulo, comentarios: n.comentarios, tarde: tarde(n) ? fecha(n.origen_s, false) : "" })),
      operaciones: D.operaciones.map((o) => ({ id: o.etiqueta, cuentas: o.cuentas })) }, location.origin);
  }
})();

</script>
